name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  macos:
    name: macOS (${{ matrix.machine.arch }})
    runs-on: ${{ matrix.machine.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        machine:
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
    env:
      ARRPI_TARGET: ${{ matrix.machine.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ matrix.machine.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos-${{ matrix.machine.arch }}-
      - name: Build, smoke-test and package macOS executable
        run: bash .github/scripts/check-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-macos-${{ matrix.machine.arch }}
          path: dist/arrpi-macos-*.tar.gz*
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        run: rustup toolchain install 1.96.1 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-static-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: windows-msvc-static-
      - name: Build, smoke-test and package Windows executable
        shell: pwsh
        run: ./.github/scripts/check-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-x86_64
          path: |
            arrpi-windows-x86_64.zip
            arrpi-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        run:
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt
          --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Cached developer tools
        id: developer-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/rulewright
            ~/.cargo/bin/markupwright
          key: dev-tools-ubuntu24-${{ runner.arch
            }}-rust1.96.1-rulewright0.1.2-markupwright0.1.3
      - name: Developer tools
        if: steps.developer-tools.outputs.cache-hit != 'true'
        run: bash .github/scripts/install-dev-tools.sh
      - name: Rust checks
        run: bash .github/scripts/check-rust.sh
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.12.4
          enable-cache: true
          cache-dependency-glob: scripts/*.py.lock
      - name: Frontend tools
        run: bash .github/scripts/setup-web.sh
      - name: Frontend and documentation checks
        run: bash .github/scripts/check-web.sh
      - name: Container integration and runtime checks
        run: bash .github/scripts/check-containers.sh
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-failures
          path: |-
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  images:
    name: Image (${{ matrix.target }}, ${{ matrix.machine.arch }})
    needs:
      - rust
      - container
      - windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - ui
        machine:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.machine.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Registry image
        id: image
        env:
          TARGET: ${{ matrix.target }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arrpi-$TARGET" >>
          "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=sha,format=long
      - name: Build and publish architecture
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.machine.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          outputs: type=image,name=${{ steps.image.outputs.name
            }},push-by-digest=true,name-canonical=true,push=true
          cache-from:
            type=gha,scope=release-${{ matrix.target }}-${{ matrix.machine.arch
            }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}-${{
            matrix.machine.arch }}
          provenance: mode=max
          sbom: true
      - name: Smoke-test native image
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/smoke-image.sh
      - name: Export and test Linux executable
        if: matrix.target == 'core'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.machine.arch }}
        run: bash .github/scripts/export-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.target == 'core'
        with:
          name: native-linux-${{ matrix.machine.arch }}
          path: dist/arrpi-linux-*.tar.gz*
          if-no-files-found: error
          retention-days: 14
      - name: Record tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digests-${{ matrix.target }}-${{ matrix.machine.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish
    needs: images
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: false
      - name: Publish tested multi-platform manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-images.sh
  release:
    name: Release
    needs:
      - windows
      - macos
      - publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          merge-multiple: true
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh
