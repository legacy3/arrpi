[package]
name = "arrpi-adapters"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
description = "Native media providers, bounded HTTP and private SQLite persistence"
license = "MIT"
repository = "https://github.com/legacy3/arrpi"
keywords = ["sonarr", "radarr", "api", "cache"]
categories = ["web-programming"]
publish = false

[dependencies]
arrpi-core = { path = "../arrpi-core" }
async-trait.workspace = true
nucleo-matcher.workspace = true
base64.workspace = true
arrayvec = { workspace = true, features = ["serde"] }
bytes.workspace = true
chrono = { workspace = true, features = ["std", "serde"] }
hmac.workspace = true
oauth-resource-server = { workspace = true, features = ["rustls-tls-native-roots"] }
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "stream"] }
rusqlite = { workspace = true, features = ["bundled"] }
rusqlite_migration.workspace = true
secrecy.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
oauth-resource-server = { workspace = true, features = ["testing"] }
axum.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["net", "test-util"] }

[lints]
workspace = true
