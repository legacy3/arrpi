[package]
name = "arrpi-core"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
description = "Media source capabilities, policies and command contracts"
license = "MIT"
repository = "https://github.com/legacy3/arrpi"
keywords = ["sonarr", "radarr", "api", "mcp"]
categories = ["web-programming"]
publish = false

[dependencies]
async-trait.workspace = true
bitflags.workspace = true
bytes.workspace = true
chrono = { workspace = true, features = ["std", "serde"] }
schemars = { workspace = true, features = ["derive"] }
secrecy.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
divan.workspace = true

[lints]
workspace = true

[[bench]]
name = "library"
harness = false

[[test]]
name = "library_allocations"
harness = false

[[bench]]
name = "contracts"
harness = false
