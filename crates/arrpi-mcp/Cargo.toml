[package]
name = "arrpi-mcp"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
description = "MCP HTTP and stdio adapters for ArrPi command executors"
license = "MIT"
repository = "https://github.com/legacy3/arrpi"
keywords = ["sonarr", "radarr", "api", "mcp"]
categories = ["web-programming"]
publish = false

[dependencies]
arrpi-core = { path = "../arrpi-core" }
axum.workspace = true
rmcp = { workspace = true, features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
